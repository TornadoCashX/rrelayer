name: relayer-service

networks:
  - name: ethereum
    chain_id: 1
    confirmations: ${ETH_CONFIRMATIONS}

    signing_provider:
      private_keys:
        - raw: ${ETH_PRIVATE_KEY_1}
        - raw: ${ETH_PRIVATE_KEY_2}

    provider_urls:
      - ${ETH_RPC_URL_1}
      - ${ETH_RPC_URL_2}
      - ${ETH_RPC_URL_3}

    block_explorer_url: https://etherscan.io
    enable_sending_blobs: false

    gas_bump_blocks_every:
      slow: 10
      medium: 6
      fast: 4
      super_fast: 2

    max_gas_price_multiplier: 4

    api_keys:
      - relayer: ${ETH_ADDRESS_1}
        keys:
          - ${ETH_API_KEY_1}
      - relayer: ${ETH_ADDRESS_2}
        keys:
          - ${ETH_API_KEY_2}

  - name: bsc
    chain_id: 56
    confirmations: ${BSC_CONFIRMATIONS}

    signing_provider:
      private_keys:
        - raw: ${BSC_PRIVATE_KEY_1}

    provider_urls:
      - ${BSC_RPC_URL_1}
      - ${BSC_RPC_URL_2}

    block_explorer_url: https://bscscan.com
    enable_sending_blobs: false

    gas_bump_blocks_every:
      slow: 64
      medium: 32
      fast: 16
      super_fast: 8

    max_gas_price_multiplier: 4

    api_keys:
      - relayer: ${BSC_ADDRESS_1}
        keys:
          - ${BSC_API_KEY_1}

api_config:
  host: "0.0.0.0"
  port: 3000
  authentication_username: ${RRELAYER_AUTH_USERNAME}
  authentication_password: ${RRELAYER_AUTH_PASSWORD}
